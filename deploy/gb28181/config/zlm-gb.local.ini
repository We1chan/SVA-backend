
# 模块：流媒体协议组 / GB28181 媒体接收。
# 职责：接收 WVP 调度的 PS-RTP，并在独立端口输出预览与分析用媒体流。
[api]
apiDebug=0
defaultSnap=./www/logo.png
downloadRoot=./www
secret=easySVA.GB28181.ZLM
snapRoot=./www/snap/

[ffmpeg]
bin=ffmpeg
log=/opt/easySVA/logs/gb-media-ffmpeg.log
restart_sec=0

[general]
check_nvidia_dev=0
enableVhost=0
enable_ffmpeg_log=0
mediaServerId=easysva-gb28181
streamNoneReaderDelayMS=20000
wait_add_track_ms=3000
wait_track_ready_ms=10000

[hook]
admin_params=secret=easySVA.GB28181.ZLM
alive_interval=10.000000
enable=1
on_flow_report=
on_play=http://127.0.0.1:18080/index/hook/on_play
on_publish=http://127.0.0.1:18080/index/hook/on_publish
on_record_mp4=http://127.0.0.1:18080/index/hook/on_record_mp4
on_rtp_server_timeout=http://127.0.0.1:18080/index/hook/on_rtp_server_timeout
on_send_rtp_stopped=http://127.0.0.1:18080/index/hook/on_send_rtp_stopped
on_server_keepalive=http://127.0.0.1:18080/index/hook/on_server_keepalive
on_server_started=http://127.0.0.1:18080/index/hook/on_server_started
on_stream_changed=http://127.0.0.1:18080/index/hook/on_stream_changed
on_stream_none_reader=http://127.0.0.1:18080/index/hook/on_stream_none_reader
on_stream_not_found=http://127.0.0.1:18080/index/hook/on_stream_not_found
retry=1
retry_delay=3.000000
timeoutSec=30

[http]
allow_cross_domains=1
allow_ip_range=::1,127.0.0.1,172.16.0.0-172.31.255.255,192.168.0.0-192.168.255.255,10.0.0.0-10.255.255.255
dirMenu=0
port=9996
rootPath=./www
sslport=0

[protocol]
enable_audio=1
enable_fmp4=1
enable_hls=0
enable_hls_fmp4=0
enable_mp4=0
enable_rtmp=1
enable_rtsp=1
enable_ts=1
mp4_save_path=/var/www/SVA-web/upload

[rtc]
port=0
tcpPort=0

[rtmp]
port=9998
sslport=0

[rtp_proxy]
gop_cache=1
port=10000
port_range=40002-45000
ps_pt=96
timeoutSec=15

[rtsp]
directProxy=1
port=9997
sslport=0

[shell]
port=0

[srt]
port=0

[cluster]
origin_url=
retry_count=3
timeout_sec=15

[ffmpeg]
cmd=%s -re -i %s -c:a aac -strict -2 -ar 44100 -ab 48k -c:v libx264 -f flv %s
snap=%s -rtsp_transport tcp -i %s -y -f mjpeg -frames:v 1 %s

[general]
broadcast_player_count_changed=0
flowThreshold=1024
listen_ip=::
maxStreamWaitMS=15000
mergeWriteMS=0
resetWhenRePlay=1
unready_frame_cache=100
wait_audio_track_data_ms=1000

[hls]
broadcastRecordTs=0
deleteDelaySec=10
fastRegister=0
fileBufSize=65536
segDelay=0
segDur=2
segKeep=0
segNum=3
segRetain=5

[hook]
on_http_access=
on_record_ts=
on_rtsp_auth=
on_rtsp_realm=
on_server_exited=
on_shell_login=
stream_changed_schemas=rtsp/rtmp/fmp4/ts/hls/hls.fmp4

[http]
charSet=utf-8
forbidCacheSuffix=
forwarded_ip_header=
keepAliveSecond=15
maxReqSize=40960
notFound=<html><head><title>404 Not Found</title></head><body bgcolor="white"><center><h1>您访问的资源不存在！</h1></center><hr><center>ZLMediaKit(git hash:46f1633/2026-08-10T21:56:19+08:00,branch:v1.2.8,build time:2026-09-01T01:37:56)</center></body></html>
sendBufSize=65536
virtualPath=

[multicast]
addrMax=239.255.255.255
addrMin=239.0.0.0
udpTTL=64

[onvif]
port=3702

[protocol]
add_mute_audio=1
auto_close=0
continue_push_ms=3000
fmp4_demand=0
hls_demand=0
hls_save_path=./www
modify_stamp=2
mp4_as_player=0
mp4_max_second=3600
paced_sender_ms=0
rtmp_demand=0
rtsp_demand=0
ts_demand=0

[python]
plugin=

[record]
appName=gb28181
enableFmp4=0
fastStart=0
fileBufSize=65536
fileRepeat=0
sampleMS=500

[rtmp]
directProxy=1
enhanced=1
handshakeSecond=15
keepAliveSecond=15

[rtp]
audioMtuSize=600
h264_stap_a=1
lowLatency=0
rtpMaxSize=10
videoMtuSize=1400

[rtp_proxy]
dumpDir=
h264_pt=98
h265_pt=99
merge_frame=1
opus_pt=100
rtp_g711_dur_ms=100
udp_recv_socket_buffer=4194304

[rtsp]
authBasic=0
handshakeSecond=15
keepAliveSecond=15
lowLatency=0
rtpTransportType=-1

[shell]
maxReqSize=1024
